name: rosu-game

on:
  release:
    types: ["published"]
  push:
    branches:
      - master
      - main
      - dev-inprogress
  pull_request:
    types: [ opened, reopened, edited, synchronize ]
    branches:
      - master
      - main
      - dev-inprogress
    paths-ignore:
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-replay-viewer:
    uses: ./.github/workflows/build_replay_viewer.yml
