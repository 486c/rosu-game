[package]
name = "rosu-game"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rosu"
path = "src/lib.rs"

[[bin]]
name = "rosu-client"
path = "src/bin.rs"

[workspace]
members = [
	"replay-viewer",
	#"wasm"
]

[workspace.dependencies]
winit = "0.30.7"
wgpu = { version = "24.0.3", features = ["webgl"] }
rosu-map = { git = "https://github.com/MaxOhn/rosu-map.git" }
egui = "0.31.1"
egui-winit = { version = "0.31.1", default-features = false }
egui-wgpu = "0.31.1"
egui_extras = { version = "0.31.1", features = ["image"] }
image = "0.25.8"


tracing = "0.1.40"
tracing-subscriber = "0.3.20"

[dependencies]
winit = { workspace = true }
rosu-map = { workspace = true }
wgpu = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true } 
egui = { workspace = true }
egui-winit = { workspace = true }
egui-wgpu = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }

log = "0.4.20"
bytemuck = { version = "1.14.0", features = ["zeroable_maybe_uninit", "zeroable_atomics"] }
cgmath = { git = "https://github.com/rustgd/cgmath.git", features = ["bytemuck"] }
rosu-pp = "0.10.0"
tracy-client = { version = "0.18.4", default-features = false }
smallvec = "1.13.2"
raw-window-handle = "0.6.2"
rust-ini = "0.21.0"
thiserror = "1.0.63"
rand = "0.8.5"
oneshot = { version = "0.1.8", default-features = false, features = ["std"] }
cfg-if = "1.0.0"
getrandom = { version = "0.2.15", features = ["js"] }
pollster = "0.3.0"
osu-replay-parser = { git = "https://github.com/486c/osr-parser", branch = "wasm" }
md5 = "0.7.0"
rfd = "0.15.4"
soloud = "1.1.1"

# Linux only deps (soloud alsa backend links libasound, absent on Windows)
[target.'cfg(not(target_os = "windows"))'.dependencies]
soloud = { version = "1.1.1", features = ["alsa"] }

# WASM only deps
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

# Windows only deps
[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
r2d2_sqlite = "0.25.0"
r2d2 = "0.8.10"

# Linux only deps
[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = "0.32.1"
r2d2_sqlite = "0.25.0"
r2d2 = "0.8.10"

[dev-dependencies]
approx = "0.5.1"
test-case = "3.3.1"
testdir = "0.9.3"

[profile.release]
#debug = 2  # or 2 for more info

#[replace]
#"egui:0.29.1" = {git = "https://github.com/486c/egui", branch = "0.29.1"}
